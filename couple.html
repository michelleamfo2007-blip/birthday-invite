<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabriel Kukuia · 50</title>
  <meta property="og:title" content="Gabriel Kukuia · 50">
  <meta property="og:description" content="A private celebration. Sunday, 29 November 2026 at 2:00 PM. N'Joy Hotel.">
  <meta property="og:image" content="https://birthday-invite-six-plum.vercel.app/preview.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gabriel Kukuia · 50">
  <meta name="twitter:description" content="A private celebration. Sunday, 29 November 2026 at 2:00 PM. N'Joy Hotel.">
  <meta name="twitter:image" content="https://birthday-invite-six-plum.vercel.app/preview.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=Outfit:wght@360;460;560&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231a1a1a'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Georgia' font-size='22' fill='%23fbfbfa'%3E50%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #2c2824;
      --muted: #8a8178;
      --line: #e4ddd4;
      --paper: #fbf8f4;
      --room: #efeae3;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--room);
      color: var(--ink);
    }

    body {
      font-family: Outfit, "Segoe UI", sans-serif;
      font-weight: 360;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
    }

    ::selection {
      background: #1a1a1a;
      color: #f7f6f3;
    }

    .bow {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 32px;
      border: 0;
      background: var(--room);
      color: var(--muted);
      cursor: pointer;
      font-family: Outfit, "Segoe UI", sans-serif;
      font-weight: 560;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      transition: opacity 0.55s ease, visibility 0.55s ease;
    }

    .bow svg {
      width: min(210px, 62vw);
      height: auto;
      display: block;
    }

    .bow-kicker {
      letter-spacing: 0.28em;
    }

    body.is-open .bow {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      display: none;
      width: min(420px, 100%);
      background: var(--paper);
      padding: 64px 44px 52px;
      box-shadow: 0 18px 50px rgba(44, 40, 36, 0.06);
    }

    body.is-open .card {
      display: block;
      animation: rise 0.7s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    .card:focus { outline: none; }

    .kicker,
    .label,
    .note,
    .phones-label,
    .hosts,
    button {
      font-family: Outfit, "Segoe UI", sans-serif;
      font-weight: 560;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .kicker {
      margin: 0;
      color: var(--muted);
    }

    .age {
      margin: 36px 0 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 52px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #4a433c;
    }

    .honoree {
      margin: 28px 0 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(2rem, 6.4vw, 2.45rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .occasion {
      margin: 18px 0 0;
      max-width: 26ch;
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--muted);
    }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin: 44px 0 0;
      padding: 26px 0 0;
      border-top: 1px solid var(--line);
      list-style: none;
    }

    .facts span {
      display: block;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 560;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .facts strong {
      display: block;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 1.05rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .location {
      display: block;
      margin: 22px 0 0;
      color: inherit;
      text-decoration: none;
    }

    .location:hover .address,
    .location:focus-visible .address {
      color: var(--ink);
      outline: none;
    }

    .venue {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .address {
      margin: 6px 0 0;
      font-size: 0.98rem;
      line-height: 1.45;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #d9d1c7;
    }

    .places {
      margin: 22px 0 0;
      font-size: 0.98rem;
      color: var(--muted);
    }

    .reply-by {
      margin: 28px 0 0;
      font-size: 0.98rem;
      color: var(--muted);
    }

    .phones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin: 10px 0 0;
    }

    .phones a {
      color: var(--ink);
      font-size: 0.98rem;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }

    .phones a:hover,
    .phones a:focus-visible {
      border-bottom-color: var(--ink);
      outline: none;
    }

    .rsvp { margin-top: 28px; }

    [hidden] { display: none !important; }

    .rsvp input {
      width: 100%;
      font-family: Outfit, "Segoe UI", sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      outline: none;
    }

    .rsvp input:focus { border-bottom-color: var(--ink); }
    .rsvp input.need { border-bottom-color: #9a3030; }

    .rsvp-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .rsvp-actions-stack { grid-template-columns: 1fr; }

    .party-note,
    .seat-note {
      margin: 16px 0 0;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--muted);
    }

    .send-reply {
      width: 100%;
      margin-top: 14px;
    }

    button {
      min-height: 48px;
      color: var(--ink);
      background: transparent;
      border: 1px solid #cfc6bc;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--ink);
      background: transparent;
      color: var(--ink);
      outline: none;
    }

    .thanks {
      margin: 28px 0 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .hosts {
      margin: 36px 0 0;
      color: var(--muted);
      font-weight: 460;
    }

    @media (max-width: 420px) {
      .card { padding: 48px 28px 40px; }
      .age { font-size: 46px; }
      .facts { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button,
      .bow { transition: none; }
      body.is-open .card { animation: none; }
    }

    @media print {
      body { background: white; padding: 0; }
      .bow { display: none !important; }
      .card { display: block !important; box-shadow: none; }
      .rsvp { display: none; }
    }
  </style>
</head>
<body>
  <button class="bow" id="open-bow" type="button" aria-label="Open the invitation">
    <span class="bow-kicker">A private celebration</span>
    <svg viewBox="0 0 280 240" aria-hidden="true">
      <path d="M132 118 L86 196 L104 202 L148 128 Z" fill="#cbb8a6"></path>
      <path d="M148 118 L194 196 L176 202 L132 128 Z" fill="#cbb8a6"></path>
      <path d="M140 112 C108 118 34 104 30 68 C26 32 92 28 140 78 Z" fill="#d9c8b7"></path>
      <path d="M140 112 C172 118 246 104 250 68 C254 32 188 28 140 78 Z" fill="#d9c8b7"></path>
      <path d="M140 104 C116 104 70 90 72 64 C74 46 112 50 140 84 Z" fill="#c4af9c"></path>
      <path d="M140 104 C164 104 210 90 208 64 C206 46 168 50 140 84 Z" fill="#c4af9c"></path>
      <ellipse cx="140" cy="116" rx="18" ry="16" fill="#a8907c"></ellipse>
      <ellipse cx="140" cy="114" rx="8" ry="7" fill="#e4d5c6"></ellipse>
    </svg>
    <span>Tap to open</span>
  </button>
  <article class="card" id="card" tabindex="-1">
    <p class="kicker">A private celebration</p>
    <p class="age" id="age">50</p>
    <h1 class="honoree" id="honoree">Gabriel Kukuia</h1>
    <p class="occasion" id="occasion"></p>
    <ul class="facts">
      <li>
        <span>Date</span>
        <strong id="date-line"></strong>
      </li>
      <li>
        <span>Time</span>
        <strong id="time-line"></strong>
      </li>
      <li>
        <span>Dress</span>
        <strong id="dress"></strong>
      </li>
    </ul>
    <a class="location" id="location" href="https://maps.google.com/?q=5.62218,-0.06226" target="_blank" rel="noopener">
      <p class="venue" id="venue"></p>
      <p class="address" id="address"></p>
    </a>
    <p class="places">Two places</p>
    <p class="reply-by" id="reply-by"></p>
    <p class="phones" id="phones"></p>
    <form class="rsvp" id="rsvp">
      <label class="visually-hidden" for="guest-name" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Your names</label>
      <input id="guest-name" name="guest" type="text" placeholder="Your names" autocomplete="name" spellcheck="false">
      <div class="rsvp-actions" id="rsvp-actions">
        <button type="button" id="accept">Accept</button>
        <button type="button" id="regret">Decline</button>
      </div>
      <div id="party" hidden>
        <p class="party-note">Will you both attend?</p>
        <div class="rsvp-actions rsvp-actions-stack">
          <button type="button" id="both">Both of us</button>
          <button type="button" id="one">Only one of us</button>
        </div>
      </div>
      <div id="one-guest" hidden>
        <label class="visually-hidden" for="attending-name" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Who will attend</label>
        <input id="attending-name" type="text" placeholder="Who will attend" autocomplete="name" spellcheck="false">
        <p class="seat-note">The other place will be offered to someone else.</p>
        <button type="button" id="release" class="send-reply">Send reply</button>
      </div>
    </form>
    <p class="hosts" id="hosts"></p>
  </article>

  <script>
    const INVITE = {
      honoree: "Gabriel Kukuia",
      age: 50,
      date: "2026-11-29",
      timeFormal: "2:00 PM",
      venue: "N'Joy Hotel",
      address: ["Spintex Sakumono Road", "Adjacent to Fridays Restaurant"],
      dress: "All white",
      rsvpBy: "2026-11-22",
      phones: ["0244481773", "0277551030"],
      whatsapp: "233244481773",
      hosts: "Strictly by invitation",
      occasion: "An afternoon of gratitude, joy and celebration."
    };

    function atNoon(iso) {
      return new Date(iso + "T12:00:00");
    }

    function monthName(iso) {
      return atNoon(iso).toLocaleDateString("en-US", { month: "long" });
    }

    function render() {
      const when = atNoon(INVITE.date);
      const reply = atNoon(INVITE.rsvpBy);
      document.title = INVITE.honoree + " · 50";
      document.getElementById("age").textContent = String(INVITE.age);
      document.getElementById("honoree").textContent = INVITE.honoree;
      document.getElementById("occasion").textContent = INVITE.occasion;
      document.getElementById("date-line").textContent =
        when.getDate() + " " + when.toLocaleDateString("en-US", { month: "short" }) + " " + when.getFullYear();
      document.getElementById("time-line").textContent = INVITE.timeFormal;
      document.getElementById("dress").textContent = INVITE.dress;
      document.getElementById("venue").textContent = INVITE.venue;
      const address = document.getElementById("address");
      address.replaceChildren();
      INVITE.address.forEach(function (line, index) {
        if (index) address.appendChild(document.createElement("br"));
        address.appendChild(document.createTextNode(line));
      });
      document.getElementById("reply-by").textContent =
        "Please reply by " + reply.getDate() + " " + monthName(INVITE.rsvpBy);
      document.getElementById("hosts").textContent = INVITE.hosts;

      const phones = document.getElementById("phones");
      phones.replaceChildren();
      INVITE.phones.forEach(function (number) {
        const link = document.createElement("a");
        link.href = "https://wa.me/233" + number.slice(1);
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = number.slice(0, 3) + " " + number.slice(3, 6) + " " + number.slice(6);
        phones.appendChild(link);
      });
    }

    function named(id) {
      const input = document.getElementById(id);
      const name = input.value.trim();
      if (!name) {
        input.classList.add("need");
        input.focus();
        return "";
      }
      return name;
    }

    function finishReply(subject, body, thanks) {
      if (INVITE.whatsapp) {
        window.open(
          "https://wa.me/" + INVITE.whatsapp + "?text=" + encodeURIComponent(subject + "\n\n" + body),
          "_blank",
          "noopener"
        );
      }
      const form = document.getElementById("rsvp");
      const note = document.createElement("p");
      note.className = "thanks";
      note.setAttribute("role", "status");
      note.textContent = thanks;
      form.replaceWith(note);
    }

    function replyBoth() {
      const name = named("guest-name");
      if (!name) return;
      finishReply(
        "Two guests — " + INVITE.honoree,
        name + " will both attend.\nTwo places kept.",
        "Two places are kept for " + name + "."
      );
    }

    function replyOne() {
      const household = named("guest-name");
      if (!household) return;
      const guest = named("attending-name");
      if (!guest) return;
      finishReply(
        "One place free — " + INVITE.honoree,
        household + " replied.\nOnly " + guest + " will attend.\nOne place is free. Please offer it to someone else.",
        "One place is kept for " + guest + ". The other place is free."
      );
    }

    function replyRegret() {
      const name = named("guest-name");
      if (!name) return;
      finishReply(
        "Unable to attend — " + INVITE.honoree,
        name + " will not attend.\nTwo places are free.",
        "Thank you. Both places are free."
      );
    }

    document.getElementById("guest-name").addEventListener("input", function (event) {
      event.target.classList.remove("need");
    });
    document.getElementById("attending-name").addEventListener("input", function (event) {
      event.target.classList.remove("need");
    });
    document.getElementById("open-bow").addEventListener("click", function () {
      if (document.body.classList.contains("is-open")) return;
      document.body.classList.add("is-open");
      document.getElementById("card").focus();
    });
    document.getElementById("accept").addEventListener("click", function () {
      if (!named("guest-name")) return;
      document.getElementById("rsvp-actions").hidden = true;
      document.getElementById("party").hidden = false;
      document.getElementById("both").focus();
    });
    document.getElementById("both").addEventListener("click", replyBoth);
    document.getElementById("one").addEventListener("click", function () {
      document.getElementById("one-guest").hidden = false;
      document.getElementById("attending-name").focus();
    });
    document.getElementById("release").addEventListener("click", replyOne);
    document.getElementById("regret").addEventListener("click", replyRegret);

    render();
  </script>
</body>
</html>
